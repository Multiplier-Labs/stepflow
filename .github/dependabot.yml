version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - Multiplier-Labs/engineering
    labels:
      - dependencies
    ignore:
      # Major @types/node bumps can expose APIs missing on the Node versions we
      # support (engines: ^22 || ^24 || >=26), so upgrade those deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - Multiplier-Labs/admin
    labels:
      - ci
