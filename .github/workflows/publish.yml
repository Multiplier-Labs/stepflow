name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with staged publishing support
        run: npm install -g npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Audit M3: a vulnerable dependency introduced between the last CI
        # run and the release tag would otherwise ship to npm. Match the
        # threshold used by ci.yml so the gate is consistent.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Stages the release; a maintainer must approve it with 2FA
      # (`npm stage approve <stage-id> --otp=<code>`) before it goes live.
      - name: Stage publish
        run: npm stage publish --provenance
